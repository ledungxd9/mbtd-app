<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Xem 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: một màn hình — thanh tên trên, khung 3D tràn giữa, dải điều khiển dưới (tầng + bật/tắt + góc nhìn); thẻ phòng nổi trên khung 3D.
   Mô hình giữ màu sa bàn (tường trắng, sàn theo vật liệu) ở cả hai giao diện; chỉ nền và khung điều khiển đổi theo sáng / tối. */
:root {
  --bg: #e8edeb; --sky: #d6e3ec; --ground: #dbe3e0; --surface: #fafcfb; --fg: #16201e; --muted: #5a6864; --line: #cdd7d3;
  --accent: #0d8775; --on-accent: #ffffff; --chip: #e0e8e4;
  --f-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "Roboto Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111817; --sky: #15222a; --ground: #1d2826; --surface: #172120; --fg: #e4edea; --muted: #94a5a0; --line: #2a3936;
    --accent: #2cb39c; --on-accent: #06211c; --chip: #223230; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111817; --sky: #15222a; --ground: #1d2826; --surface: #172120; --fg: #e4edea; --muted: #94a5a0; --line: #2a3936;
  --accent: #2cb39c; --on-accent: #06211c; --chip: #223230; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .id { min-width: 0; flex: 1; }
.top h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { flex: none; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 6px; }
#stage { position: relative; flex: 1; min-height: 0; background: linear-gradient(180deg, var(--sky) 0%, var(--bg) 55%); }   /* trời sau nhà (canvas trong suốt) */
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.hint { position: absolute; left: 16px; right: 16px; top: 10px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; }
.hint.off { opacity: 0; }
.sheet { position: absolute; left: 16px; bottom: 12px; max-width: min(360px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); display: grid; gap: 2px; }
.sheet .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sheet .n { font-size: 16px; font-weight: 700; }
.sheet .v { font-family: var(--f-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.sheet button { justify-self: start; margin-top: 4px; }
.dock { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; }
.row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.row::-webkit-scrollbar { display: none; }
.row .lab { flex: none; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 54px; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { flex: none; border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; line-height: 1.2; }
.chip small { display: block; font-family: var(--f-num); font-size: 10px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .85; }
.chip:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; font-weight: 500; }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="id">
      <h1 id="name">Bố trí MBTD</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span class="tag" style="visibility:hidden">3D</span>
  </header>
  <main id="stage">
    <div class="hint" id="hint">Kéo để xoay · chụm hai ngón để phóng · chạm vào phòng / đồ để xem kích thước</div>
    <div class="sheet" id="sheet" hidden>
      <div class="k" id="sk"></div>
      <div class="n" id="sn"></div>
      <div class="v" id="sv"></div>
      <button class="link" id="sclose" type="button">Đóng</button>
    </div>
  </main>
  <nav class="dock" aria-label="Điều khiển">
    <div class="row" id="floors"><span class="lab">Tầng</span></div>
    <div class="row">
      <span class="lab">Hiện</span>
      <button class="chip" id="tFurn" type="button" aria-pressed="true">Nội thất</button>
      <button class="chip" id="tExplode" type="button" aria-pressed="false">Tách tầng</button>
      <button class="chip" id="tLabels" type="button" aria-pressed="true">Cao độ</button>
    </div>
    <div class="row">
      <span class="lab">Nhìn</span>
      <button class="chip" data-view="persp" type="button" aria-pressed="true">Phối cảnh</button>
      <button class="chip" data-view="top" type="button" aria-pressed="false">Từ trên</button>
      <button class="chip" data-view="front" type="button" aria-pressed="false">Mặt tiền</button>
      <button class="chip" data-view="side" type="button" aria-pressed="false">Mặt bên</button>
    </div>
  </nav>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script>
const SCENE = (function () { try { return JSON.parse(sessionStorage.getItem("mbtd.scene") || "null"); } catch (e) { return null; } })();
</script>
<script>
(function () {
  "use strict";
  const stage = document.getElementById("stage");
  if (!window.THREE || !THREE.OrbitControls || !SCENE) {
    const d = document.createElement("div"); d.className = "err";
    d.textContent = !SCENE ? "Chưa có dữ liệu bố trí (chạy build_mbtd3d.ps1 -Mbtd <file>)." : "Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi mở lại trang.";
    stage.appendChild(d); return;
  }
  const S = SCENE, M = 0.001, W = S.W * M, D = S.D * M;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const vn = (v, d) => v.toLocaleString("vi-VN", { minimumFractionDigits: d, maximumFractionDigits: d });
  const lvl = mm => (mm === 0 ? "±" : mm > 0 ? "+" : "−") + (Math.abs(mm) / 1000).toFixed(3);
  const nTum = S.floors.filter(f => f.tum).length, nFl = S.floors.length - nTum;
  const nOpen = S.floors.reduce((a, f) => a + f.opens.length, 0), nFurn = S.floors.reduce((a, f) => a + f.furn.length, 0);
  // chiều cao nhà = tầng cao nhất có phòng (tầng / tum chưa xếp phòng không tính — trước khung hình thu nhỏ vì tầng trống) + nóc mái dốc
  const usedFl = S.floors.filter(f => f.cells.length || f.sv);
  const totalH = (S.roof || []).reduce((a, r) => Math.max(a, (r.zt || 0) * M), (usedFl.length ? usedFl : S.floors).reduce((a, f) => Math.max(a, (f.z + f.h) * M), 0))
    + ((S.roof || []).length || S.survey ? 0 : 0.95);     // mái bằng: + tường chắn mái 900 + gờ (parapets)
  const nNote = S.floors.reduce((a, f) => a + (f.sv && f.sv.notes ? f.sv.notes.length : 0), 0);
  document.getElementById("name").textContent = S.survey ? "Hiện trạng · " + (S.name || "") : "Nhà phố " + vn(S.W / 1000, S.W % 1000 ? 1 : 0) + " × " + vn(S.D / 1000, S.D % 1000 ? 1 : 0) + " m";
  document.getElementById("sub").textContent = nFl + " tầng" + (nTum ? " + tum" : "") + " · " + nOpen + " cửa · "
    + (S.survey ? nNote + " ghi chú" : nFurn + " món nội thất") + (S.saved ? " · lưu " + S.saved : "");

  // ---------- renderer / cảnh ----------
  // Chất lượng hình (người dùng 2026-10-12 "cải thiện chất lượng hình ảnh 3d trên app điện thoại"): ánh sáng trời (môi trường PMREM) + nắng có bóng,
  // tông ACES (tường trắng không cháy sáng), nét viền kiểu sa bàn (lượt pháp tuyến + độ sâu → dò cạnh trên màn hình — khối ghép không lộ đường nối),
  // vân sàn gạch / gỗ, khung hình vừa màn hình dọc. Chỉ vẽ lại khi có thay đổi (đỡ tốn pin), bóng chỉ tính lại khi đổi cảnh.
  if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;   // màu khai báo (0xRRGGBB, CSS) là sRGB → đổi sang tuyến tính (trước: coi như tuyến tính → hình bạc, chói)
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(DPR); renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
  renderer.domElement.tabIndex = 0; renderer.domElement.setAttribute("aria-label", "Mô hình 3D ngôi nhà");
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 600);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = !reduce; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 1.5; controls.maxDistance = 200;
  controls.screenSpacePanning = true;
  let need = 2;                                   // số khung còn phải vẽ (0 = đứng yên, không vẽ)
  const redraw = shadows => { need = Math.max(need, 1); if (shadows) renderer.shadowMap.needsUpdate = true; };
  controls.addEventListener("change", () => redraw());

  // nắng chiều xiên từ phía trước – trái (mặt tiền sáng, mặt bên trong bóng) + bầu trời làm ánh sáng môi trường
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const SUN_SIDE = V3(-0.5, 0.78, 0.62).normalize(), SUN_TOP = V3(-0.28, 0.93, 0.24).normalize();   // cả nhà: xiên; xem một tầng: gần đỉnh đầu (bóng tường ngắn, mặt bằng dễ đọc)
  const sunDir = SUN_SIDE.clone();
  const hemi = new THREE.HemisphereLight(0xe9f0f6, 0x8c867c, 0.18);
  const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.025;
  scene.add(hemi, sun, sun.target);
  function fitSun(b) {                            // khung bóng ôm phần đang hiện
    sunDir.copy(sel >= 0 ? SUN_TOP : SUN_SIDE);
    const c = b.getCenter(V3()), r = b.getSize(V3()).length() / 2 + 1, sc = sun.shadow.camera;
    sun.target.position.copy(c); sun.position.copy(c).addScaledVector(sunDir, r + 6);
    sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 0.5; sc.far = 2 * r + 12; sc.updateProjectionMatrix();
    renderer.shadowMap.needsUpdate = true;
  }
  (function skyEnv() {                            // bầu trời: đỉnh xanh, chân trời trắng, mặt đất xám ấm + đốm nắng → phản chiếu kính, sáng dịu các mặt khuất
    const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene(), R = 40;
    const geo = new THREE.SphereGeometry(R, 48, 24), p = geo.attributes.position, col = [];
    const zen = new THREE.Color(0.30, 0.46, 0.82), hor = new THREE.Color(0.80, 0.83, 0.87), gnd = new THREE.Color(0.24, 0.22, 0.20);
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / R, c = y >= 0 ? hor.clone().lerp(zen, Math.pow(y, 0.55)) : hor.clone().lerp(gnd, Math.min(1, -y * 5));
      col.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    es.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const glow = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.94, 0.82).multiplyScalar(8) }));
    glow.position.copy(sunDir).multiplyScalar(R - 6); es.add(glow);
    scene.environment = pm.fromScene(es, 0.035).texture; pm.dispose();
  })();

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // mặt đất: tấm lớn mờ dần ra xa (alphaMap tròn) trên nền trời CSS của khung — không có mép đất cụt
  const fade = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = 256; const x = cv.getContext("2d"), gr = x.createRadialGradient(128, 128, 30, 128, 128, 128);
    gr.addColorStop(0, "#fff"); gr.addColorStop(0.55, "#fff"); gr.addColorStop(1, "#000"); x.fillStyle = gr; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(cv); })();
  const groundMat = new THREE.MeshStandardMaterial({ roughness: 1, alphaMap: fade, transparent: true, depthWrite: false });
  const gs = Math.max(W, D) * 3 + 40;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(gs, gs), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.set(W / 2, -0.152, -D / 2); ground.receiveShadow = true; ground.renderOrder = -1; scene.add(ground);
  function applyTheme() { groundMat.color.set(css("--ground")); redraw(); }
  applyTheme();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // nét viền: lượt 1 vẽ pháp tuyến + độ sâu ra RT (không vẽ đất / nhãn), lượt 3 phủ nét theo bước nhảy pháp tuyến / độ sâu (Laplace của 1/z — mặt phẳng nghiêng không ra nét giả)
  const edgeOK = renderer.capabilities.isWebGL2 || renderer.extensions.has("WEBGL_depth_texture");
  let showEdges = edgeOK;
  const rtN = new THREE.WebGLRenderTarget(4, 4, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  rtN.depthTexture = new THREE.DepthTexture(4, 4); rtN.depthTexture.type = THREE.UnsignedIntType;
  const normMat = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });   // hai mặt: khe giữa các khối ghép thấy mặt sau cùng hướng → không ra nét giả
  const edgeMat = new THREE.ShaderMaterial({
    uniforms: { tN: { value: rtN.texture }, tD: { value: rtN.depthTexture }, px: { value: new THREE.Vector2(1, 1) }, cn: { value: 0.1 }, cf: { value: 600 },
      col: { value: new THREE.Color(0x26302d).convertLinearToSRGB() }, k: { value: 0.62 } },   // shader ghi thẳng ra màn hình (sRGB)
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
    fragmentShader: [
      "uniform sampler2D tN; uniform sampler2D tD; uniform vec2 px; uniform float cn; uniform float cf; uniform vec3 col; uniform float k; varying vec2 vUv;",
      "float iw(vec2 uv){ float d = texture2D(tD, uv).x; return ((cf - cn) * d - cf) / (-cn * cf); }",          // 1 / khoảng cách (tuyến tính trên màn hình với mặt phẳng)
      "vec3 nr(vec2 uv){ return texture2D(tN, uv).xyz * 2.0 - 1.0; }",
      // một trục: 5 mẫu; khe nứt 1 điểm ảnh giữa hai khối ghép (mối nối chữ T) — mẫu ±1 lệch nhưng ±2 trùng mặt → coi như liền, không ra chấm
      "float axisE(vec2 o, float w0, vec3 n0){",
      "  float wa = iw(vUv - o), wb = iw(vUv + o), wa2 = iw(vUv - 2.0 * o), wb2 = iw(vUv + 2.0 * o);",
      "  vec3 na = nr(vUv - o), nb = nr(vUv + o), na2 = nr(vUv - 2.0 * o), nb2 = nr(vUv + 2.0 * o);",
      "  float tol = 0.004 * w0;",
      // điểm lẻ (khe sâu hoặc một điểm mặt bên chen vào chỗ hai mặt phẳng trùng nhau): mẫu ±2 cùng mặt với tâm → bỏ mẫu ±1
      "  if (abs(wa2 - w0) < tol && dot(na2, n0) > 0.98 && (abs(wa - w0) > tol || dot(na, n0) < 0.98)) { wa = w0; na = n0; }",
      "  if (abs(wb2 - w0) < tol && dot(nb2, n0) > 0.98 && (abs(wb - w0) > tol || dot(nb, n0) < 0.98)) { wb = w0; nb = n0; }",
      "  if (abs(wa - wb) < 0.004 * wa && dot(na, nb) > 0.98 && (abs(w0 - wa) > 0.004 * wa || dot(n0, na) < 0.98)) return 0.0;",   // chính tâm là điểm lẻ
      "  float lap = abs(wa + wb - 2.0 * w0) / max(min(w0, min(wa, wb)), 1e-6);",
      "  float e = smoothstep(0.014, 0.045, lap);",
      "  float dn = min(dot(n0, na), dot(n0, nb));",
      "  return max(e, 1.0 - smoothstep(0.82, 0.96, dn));",
      "}",
      "void main(){",
      "  float w0 = iw(vUv); vec3 n0 = nr(vUv);",
      "  float e = max(axisE(vec2(px.x, 0.0), w0, n0), axisE(vec2(0.0, px.y), w0, n0));",
      "  if (w0 < 1.5 / cf) e *= 0.85;",                                                                         // phía nền trời của đường bao: nhạt hơn một chút
      "  gl_FragColor = vec4(col, e * k);",
      "}"].join("\n"),
    transparent: true, depthTest: false, depthWrite: false, toneMapped: false
  });
  const edgeScene = new THREE.Scene(), edgeCam = new THREE.Camera();
  const edgeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), edgeMat); edgeQuad.frustumCulled = false; edgeScene.add(edgeQuad);

  // ---------- vật liệu (màu sa bàn) ----------
  const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o || {}));
  const PO = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 };
  const MT = {
    // tường lùi độ sâu một chút (polygonOffset): đỉnh tường trùng mặt bản sàn / mái phía trên thì sàn thắng, không nhấp nháy
    // bản sàn cùng màu tường ngoài: mép sàn trùng mặt tường không thành vệt; mặt mái riêng (roofTop); cột trát cùng màu tường
    wall: mat(0xeeebe5, PO), wallExt: mat(0xe9e3d8, PO), low: mat(0xddd7cc, PO), slab: mat(0xe9e3d8), roofTop: mat(0xcfcac1),
    col: mat(0xeeebe5, PO), cut: new THREE.MeshBasicMaterial(Object.assign({ color: 0x434c4a, toneMapped: false }, PO)),   // đỉnh tường khi xem một tầng: tô đậm như mặt bằng
    glass: mat(0x9cc4d0, { transparent: true, opacity: 0.3, roughness: 0.04, metalness: 0, envMapIntensity: 1.6, depthWrite: false }),
    frost: mat(0xdfe8ea, { transparent: true, opacity: 0.78, roughness: 0.35 }),
    frame: mat(0x3a4245, { roughness: 0.45, metalness: 0.5 }), woodDoor: mat(0xa77d55, { roughness: 0.7 }), woodPanel: mat(0x93694a, { roughness: 0.7 }),

    const fw = f.walls.filter(w => w[6] && !w[7] && frontFacing(f, w));
    const pw = parList.filter(q => q.li === li && frontFacing(f, q.w));
    const kind = FAC === "dago" ? (li === 0 ? "da" : "go") : FAC, slats = [];
    if (kind) {
      fw.forEach(w => clad(g, kind, w, z + w[4] * M, z + Math.min(w[5] * M, h), slats));
      pw.forEach(q => clad(g, kind, q.w, q.zb, q.zt, slats));
      mergedMesh(g, MT.slat, slats);
    }
    if (!STY || !fw.length) return;
    const yo = Math.min(...fw.map(w => Math.min(w[1], w[3]))), main = fw.filter(w => Math.min(w[1], w[3]) <= yo + 60);
    const fx0 = Math.min(...main.map(w => Math.min(w[0], w[2]))) * M, fx1 = Math.max(...main.map(w => Math.max(w[0], w[2]))) * M;
    const zo = -yo * M + 0.002 + facThick(kind), tr = [];
    const add = (x0, x1, z0, z1, d) => tr.push(boxGeo(x0, x1, z0, z1, zo, zo + d));
    // cột ốp hai đầu mặt tiền: thân + đế + mũ cột
    [[fx0, fx0 + 0.32], [fx1 - 0.32, fx1]].forEach(([p, q]) => { add(p, q, z, z + h, 0.06); add(p - 0.04, q + 0.04, z, z + 0.24, 0.09); add(p - 0.05, q + 0.05, z + h - 0.42, z + h - 0.3, 0.1); });
    // phào tầng (tầng trên tiếp tục cùng mặt) / phào đỉnh (mặt tiền dừng ở tầng này)
    const nf = S.floors[li + 1], cont = nf && nf.walls.some(w => w[6] && !w[7] && frontFacing(nf, w) && Math.abs(Math.min(w[1], w[3]) - yo) < 60);
    if (cont) add(fx0 - 0.06, fx1 + 0.06, z + h - 0.12, z + h + 0.1, 0.1);
    else {                                        // phào đỉnh; có mái dốc ngay trên: hạ dưới diềm mái (không đâm xuyên mái)
      const ct = sloped && li === roofLi ? z + h - 0.03 : z + h + 0.03;
      add(fx0 - 0.1, fx1 + 0.1, ct - 0.29, ct - 0.15, 0.09); add(fx0 - 0.16, fx1 + 0.16, ct - 0.15, ct, 0.2);
    }
    // viền ô cửa trên mặt chính: viền 90, mũ cửa, đá khóa, bậu cửa sổ
    f.opens.forEach(o => {
      const [kd, x, y, ax, wd, sl, ht, wt] = o;
      if (!ax || Math.abs(y - (wt || 0) / 2 - yo) > 60 || kd === "LO") return;
      const w = wd * M, xa = x * M - w / 2, xb = x * M + w / 2, zs = z + sl * M, zh = zs + ht * M, t = 0.09, win = kd === "SO" || kd === "SOWC";
      add(xa - t, xa, zs, zh + t, 0.04); add(xb, xb + t, zs, zh + t, 0.04); add(xa - t, xb + t, zh, zh + t, 0.04);
      add(xa - t - 0.08, xb + t + 0.08, zh + t, zh + t + 0.1, 0.13);
      add(x * M - 0.08, x * M + 0.08, zh - 0.05, zh + t + 0.05, 0.07);
      if (win) add(xa - t - 0.04, xb + t + 0.04, zs - 0.08, zs, 0.1);
    });
    mergedMesh(g, MT.trim, tr);
  }

  S.floors.forEach((f, li) => {
    const g = new THREE.Group(), z = f.z * M, h = f.h * M, top = li === S.floors.length - 1, above = S.floors[li + 1];
    g.userData = { li, z }; groups.push(g); scene.add(g);
    // sàn (kết cấu) + mặt sàn hoàn thiện theo phòng (lọt lòng) — chạm để xem
    f.cells.forEach(c => {
      const [kind, name, x0, y0, x1, y1, nx0, ny0, nx1, ny1, air, ar] = c;
      // giếng trời / thông tầng: hở trời; lỗ thang (tầng trên): không sàn nhưng vẫn có mái nếu là tầng trên cùng (trước: mái tum thủng lỗ trên cầu thang)
      const open = kind === "GT" || kind === "THONG", hole = open || ((kind === "THANG" || kind === "TM") && li > 0);
      if (!hole) {
        box(g, MT.slab, x0, y0, x1, y1, li === 0 ? z - 0.15 : z - 0.1, z, "slab");
        const fm = box(g, floorMat(kind, air), nx0, ny0, nx1, ny1, z, z + 0.004, "finish");
        if (fm) { fm.castShadow = false; fm.userData.info = { k: (f.tum ? "Tum" : "Tầng " + f.lv) + " · " + lvl(f.z), n: name || kind,
          v: vn(ar, 1) + " m² · lọt lòng " + vn((nx1 - nx0) / 1000, 2) + " × " + vn((ny1 - ny0) / 1000, 2) + " m" }; pickables.push(fm); }
      }
      // mái: phần không có tầng trên che (ô ngoài trời / giếng trời không có mái)
      if (!open && !air && (top || !above.cells.some(u => inside((x0 + x1) / 2, (y0 + y1) / 2, u)))) box(g, ROOFM, x0, y0, x1, y1, z + h - 0.1, z + h, "roof");
    });
    // tường (đã khoét ô cửa) chạy suốt tới mặt sàn trên: mặt ngoài liền, không lộ rãnh lõm ở mép bản sàn (sàn tim tường lùi vào trong lòng tường);
    // đỉnh tường trùng mặt sàn trên → vật liệu sàn có polygonOffset nên đỉnh tường thắng, không nhấp nháy
    f.walls.forEach(w => {
      const [x0, y0, x1, y1, z0, z1, ex, low] = w, zt = Math.min(z1 * M, h);
      if (low && STY && frontFacing(f, w)) { balustrade(g, w, z + z0 * M, z + zt); return; }   // tân cổ điển: lan can con tiện
      const me = box(g, low ? MT.low : ex ? MT.wallExt : MT.wall, x0, y0, x1, y1, z + z0 * M, z + zt, "wall");
      if (me && !low && zt >= h - 0.002) me.userData.full = true;
    });
    parapets(g, f, li, z, h);
    f.cols.forEach(c => { const me = box(g, MT.col, c[0], c[1], c[2], c[3], z, z + h, "wall"); if (me) me.userData.full = true; });
    // tam cấp trước cửa chính (lõi Dtool PlanGen.FreeFrontSteps, cảnh 2026-10-06): [n x0 y0 x1 y1 cốtSân] — bậc k (0 sát tường) mặt trên −k × (−cốtSân) / n
    (f.steps || []).forEach(s => {
      const [n, x0, y0, x1, y1, gr] = s, rise = -gr / n, tr = (y0 - y1) / n;
      for (let k = 0; k < n; k++) box(g, MT.slab, x0, y0 - (k + 1) * tr, x1, y0 - k * tr, z + gr * M, z - k * rise * M, "steps");
    });
    f.opens.forEach(o => opening(g, o, z));
    f.stairs.forEach(s => stair(g, s, z, h));
    f.furn.forEach(it => furniture(g, it, z, f));
    if (f.sv) svBuild(g, f, z);
  });

  // ---------- mái dốc tầng trên cùng (Scene3d.RoofJson — lõi Roof.cs của Dtool; 2026-10-11 "nhà mái nhật, mái thái, tân cổ điển") ----------
  // r.faces: mảnh lồi mặt trên mái [x y z …] mm (z tuyệt đối) → tấm dày r.t theo phương đứng; r.gables: tường đầu hồi (mặt ngoài p, pháp tuyến n vào trong)
  const ROOFC = { 1: 0x545860, 2: 0xa64e36, 3: 0x42464e }, roofMats = {};
  function solidOf(top, bot) {                     // hai vòng cùng số đỉnh (lồi) → khối kín, pháp tuyến phẳng
    const P = [], tri = (a, b, c) => P.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]), n = top.length;
    for (let i = 1; i + 1 < n; i++) { tri(top[0], top[i], top[i + 1]); tri(bot[0], bot[i + 1], bot[i]); }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; tri(top[i], bot[i], bot[j]); tri(top[i], bot[j], top[j]); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(P, 3)); geo.computeVertexNormals(); return geo;
  }
  const v3 = (x, y, zz) => [x * M, zz * M, -y * M];
  // ngói có vân theo kiểu mái (FXT.tile1 Nhật / tile2 Thái / tile3 Mansard): UV mỗi mảnh = (dọc mái, theo dốc) mét thật; bờ nóc / bờ trụ (úp nóc) trên
  // cạnh chung của hai mặt mái khác hướng (không phải mép diềm)
  function roof3(g, r) {
    const m = roofMats[r.kind] || (roofMats[r.kind] = mat(ROOFC[r.kind] || 0xa64e36, { roughness: 0.7, side: THREE.DoubleSide, map: FXT["tile" + r.kind] || FXT.tile2 }));
    const capM = roofMats["c" + r.kind] || (roofMats["c" + r.kind] = mat(new THREE.Color(ROOFC[r.kind] || 0xa64e36).multiplyScalar(0.8), { roughness: 0.6 }));
    const t = Math.max(40, r.t || 120), ze = (r.ze != null ? r.ze : r.zw || 0) + 60, faces = [];
    (r.faces || []).forEach(a => {
      const top = [], bot = [], mm = [];
      for (let i = 0; i + 2 < a.length; i += 3) { top.push(v3(a[i], a[i + 1], a[i + 2])); bot.push(v3(a[i], a[i + 1], a[i + 2] - t)); mm.push([a[i], a[i + 1], a[i + 2]]); }
      if (top.length < 3) return;
      const geo = solidOf(top, bot);
      const p0 = V3(...top[0]), nrm = V3(...top[1]).sub(p0).cross(V3(...top[2]).sub(p0)).normalize(); if (nrm.y < 0) nrm.negate();
      let hx = V3(0, 1, 0).cross(nrm); if (hx.lengthSq() < 1e-6) hx = V3(1, 0, 0); hx.normalize();
      let sl = nrm.clone().cross(hx).normalize(); if (sl.y < 0) { sl.negate(); hx.negate(); }
      const pos = geo.attributes.position, uv = new Float32Array(pos.count * 2), q = V3();
      for (let i = 0; i < pos.count; i++) { q.fromBufferAttribute(pos, i); uv[2 * i] = q.dot(hx); uv[2 * i + 1] = q.dot(sl); }
      geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      const me = new THREE.Mesh(geo, m); me.castShadow = true; me.receiveShadow = true; me.userData.role = "roof"; g.add(me);
      faces.push({ mm, nrm });
    });
    const key = (p, q) => { const k1 = p.map(Math.round).join(","), k2 = q.map(Math.round).join(","); return k1 < k2 ? k1 + "|" + k2 : k2 + "|" + k1; };
    const edges = {};
    faces.forEach((f, fi) => f.mm.forEach((p, i) => { const q = f.mm[(i + 1) % f.mm.length], k = key(p, q); (edges[k] = edges[k] || []).push({ fi, p, q }); }));
    const caps = [];
    Object.values(edges).forEach(es => {
      if (es.length < 2) return;
      const [e1, e2] = es, n1 = faces[e1.fi].nrm, n2 = faces[e2.fi].nrm;
      if (n1.dot(n2) > 0.996 || Math.max(e1.p[2], e1.q[2]) < ze) return;               // mảnh cùng mặt phẳng / mép diềm
      const A = V3(...v3(...e1.p)), B = V3(...v3(...e1.q)), L = A.distanceTo(B); if (L < 0.05) return;
      const xa = B.clone().sub(A).normalize(), ya0 = n1.clone().add(n2).normalize(), ya = ya0.sub(xa.clone().multiplyScalar(ya0.dot(xa))).normalize(), za = xa.clone().cross(ya);
      const gg = new THREE.BoxGeometry(L + 0.04, 0.11, 0.2).toNonIndexed(); gg.translate(0, 0.03, 0);
      gg.applyMatrix4(new THREE.Matrix4().makeBasis(xa, ya, za).setPosition(A.clone().add(B).multiplyScalar(0.5)));
      caps.push(gg);
    });
    if (caps.length) { const me = new THREE.Mesh(mergeGeos(caps), capM); me.castShadow = true; me.receiveShadow = true; me.userData.role = "roof"; g.add(me); }
    (r.gables || []).forEach(gb => {
      const p = gb.p || [], nx = (gb.n || [0, 0])[0], ny = (gb.n || [0, 0])[1], T = S.To || 220, out = [], inn = [];
      for (let i = 0; i + 2 < p.length; i += 3) { out.push(v3(p[i], p[i + 1], p[i + 2])); inn.push(v3(p[i] + nx * T, p[i + 1] + ny * T, p[i + 2])); }
      if (out.length < 3) return;
      const me = new THREE.Mesh(solidOf(out, inn), MT.wallExt); me.castShadow = true; me.receiveShadow = true; me.userData.role = "roof"; g.add(me);
    });
  }
  if (groups.length) (S.roof || []).forEach(r => roof3(groups[groups.length - 1], r));
  if (!S.survey) groups.forEach((g, li) => dress(li));

  // ---------- hiện trạng (Core\SurveyScene.cs): sàn / mái / mặt hoàn thiện theo đa giác phòng, mảnh tường đa giác, ghim ghi chú ----------
  function svBuild(g, f, z) {
    const sv = f.sv, fk = (f.tum ? "Tum" : "Tầng " + f.lv) + " · hiện trạng";
    (sv.slabs || []).forEach(([code, zb, zt, pts, name, kind, ar]) => {
      if (!pts || pts.length < 6) return;
      if (code === "f") {
        const me = prism(g, floorMat(kind === "AIR" ? "" : kind, kind === "AIR"), pts, z + zb * M, z + zt * M); me.castShadow = false;
        me.userData.info = { k: fk, n: name || "Phòng", v: vn(ar, 1) + " m²" }; pickables.push(me);
      } else { const me = prism(g, MT.slab, pts, z + zb * M, z + zt * M); if (code === "r") me.userData.role = "roof"; }
    });
    (sv.walls || []).forEach(([zb, zt, code, pts]) => {
      if (!pts || pts.length < 6) return;
      const me = prism(g, code === "d" ? MT.demo : code === "l" ? MT.low : code === "x" ? MT.wallExt : code === "c" ? MT.col : MT.wall, pts, z + zb * M, z + zt * M);
      if (code === "d") { me.userData.info = { k: fk, n: "Tường phá dỡ", v: "" }; pickables.push(me); }
    });
    const NN = { crack: "Vết nứt", leak: "Thấm / dột", photo: "Ảnh hiện trạng", note: "Ghi chú" };
    (sv.notes || []).forEach(([kind, text, x, y, np]) => {
      const me = new THREE.Mesh(new THREE.SphereGeometry(0.13, 18, 12), kind === "crack" ? MT.pinRed : kind === "leak" ? MT.pinBlue : MT.pinGreen);
      me.position.set(x * M, z + 1.6, -y * M); me.userData.info = { k: fk + " · " + (NN[kind] || "Ghi chú"), n: text || NN[kind] || "Ghi chú", v: np ? np + " ảnh" : "" };
      g.add(me); pickables.push(me);
    });
    (sv.spots || []).forEach(([x, y, zz, text]) => {     // điểm cốt: mũi nhọn chạm đúng cao độ đo (mm so với ±0.000)
      const me = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.24, 16), MT.pinBlue); me.rotation.x = Math.PI;
      me.position.set(x * M, zz * M + 0.12, -y * M); me.userData.info = { k: fk + " · điểm cốt", n: lvl(Math.round(zz)), v: text || "" };
      g.add(me); pickables.push(me);
    });
  }

  // ---------- cửa ----------
  // Vẽ theo kiểu cửa của lõi (o[12] PlanGen.OpenStyle: swing / swing2l / slide / fold / glass / grille / roll / awning / louver / arch) và vật liệu theo mẫu
  // (o[13] PlanFree.OpenModels): gỗ có pano, nhôm kính, kính cường lực, thép; cửa đi có khuôn, cửa sổ có bậu; tay nắm. Mỗi vật liệu của một cửa = một mesh
  // (ghép hộp — ít lệnh vẽ trên điện thoại).
  function opening(g, o, z) {
    const [kind, x, y, ax, wd, sill, ht, wt, into0, hinge, ang, segs, style0, model, nl0] = o;   // SEGS: cánh của lõi [[bản lề dọc tường mm, dài mm, hướng đóng ±1]…]
    if (kind === "LO") return;                     // lỗ trống (hiện trạng): không cánh
    const w = wd * M, hh = ht * M, zs = z + sill * M, into = into0 || 1, T = Math.max(0.08, (wt || 200) * M);
    const win = kind === "SO" || kind === "SOWC", style = style0 || "swing";
    const mk = OPM[model] || (win ? "glass" : /^(CUACHINH|CUABC|CUASAU)$/.test(kind) ? "glass" : kind === "CUAWC" ? "frost" : "wood");
    // ANG (hiện trạng, tường xiên): góc dọc tường (radian, hệ lô) — pháp tuyến = bên trái hướng dọc tường
    const u = ang != null ? V3(Math.cos(ang), 0, -Math.sin(ang)) : ax ? V3(1, 0, 0) : V3(0, 0, -1);   // dọc tường
    const nrm = ang != null ? V3(-Math.sin(ang), 0, -Math.cos(ang)) : ax ? V3(0, 0, -1) : V3(1, 0, 0);
    const c = V3(x * M, 0, -y * M), a0 = c.clone().addScaledVector(u, -w / 2);
    const yaw = v => Math.atan2(-v.z, v.x);
    // hộp cục bộ [x0 y0 dài cao dày lệchPhápTuyến xoayQuanhX]: x dọc DIR từ AT, y lên từ ZB
    function parts(m, at, dir, zb, list, tilt) {
      const th = yaw(dir), s = Math.sin(th) * nrm.x + Math.cos(th) * nrm.z;
      const geos = list.filter(b => b[2] > 0.002 && b[3] > 0.002).map(([x0, y0, len, hgt, thick, no, rx]) => {
        const gg = new THREE.BoxGeometry(len, hgt, thick); if (rx) gg.rotateX(rx); gg.translate(x0 + len / 2, y0 + hgt / 2, s * (no || 0)); return gg.toNonIndexed();
      });
      if (!geos.length) return null;
      const me = new THREE.Mesh(mergeGeos(geos), m); me.position.set(at.x, zb, at.z);
      if (tilt) { me.rotation.order = "YXZ"; me.rotation.x = tilt * s; }
      me.rotation.y = th; me.castShadow = true; me.receiveShadow = true; g.add(me); return me;
    }
    const FR = 0.05;                               // khung nhôm / khuôn
    const frameBars = (len, hgt, f, d) => [[0, 0, len, f, d], [0, hgt - f, len, f, d], [0, 0, f, hgt, d], [len - f, 0, f, hgt, d]];
    // một cánh đóng nằm theo DIR từ AT (cao HGT từ ZB): gỗ pano / kính khung / kính mờ / kính cường lực / thép; tay nắm ở đầu tự do
    function leaf(at, dir, len, hgt, zb, m2, handle) {
      const hy = Math.min(1.0, hgt * 0.5) - (zb - z), hx = Math.max(0.04, len - 0.17);
      if (m2 === "wood") {
        parts(MT.woodDoor, at, dir, zb, [[0, 0, len, hgt, 0.04]]);
        if (len > 0.42 && hgt > 1.2) parts(MT.woodPanel, at, dir, zb, [[0.11, 0.14, len - 0.22, hgt * 0.42 - 0.14, 0.058], [0.11, hgt * 0.5, len - 0.22, hgt * 0.5 - 0.14, 0.058]]);
      } else if (m2 === "steel") {
        parts(MT.steelDoor, at, dir, zb, [[0, 0, len, hgt, 0.045]]);
      } else if (m2 === "frameless") {
        parts(MT.glass, at, dir, zb, [[0, 0, len, hgt, 0.012]]);
        parts(MT.steel, at, dir, zb, [[0, 0, 0.13, 0.07, 0.032], [0, hgt - 0.07, 0.13, 0.07, 0.032]].concat(handle ? [[len - 0.1, hy - 0.3, 0.025, 0.6, 0.07]] : []));
        return;
      } else {
        parts(m2 === "frost" ? MT.frost : MT.glass, at, dir, zb, [[FR, FR, len - 2 * FR, hgt - 2 * FR, 0.012]]);
        parts(MT.frame, at, dir, zb, frameBars(len, hgt, FR, 0.045));
      }
      if (handle) parts(MT.frame, at, dir, zb, [[hx, hy, 0.12, 0.025, 0.1]]);
    }
    const sillBox = () => parts(MT.sill, a0.clone().addScaledVector(u, -0.04), u, zs - 0.03, [[0, 0, w + 0.08, 0.03, T + 0.08]]);   // bậu đá cả hai mặt tường
    if (win) {
      sillBox();
      if (style === "awning") {                   // mở hất: khung cố định + cánh treo bản lề trên, hất ra 18°
        parts(MT.frame, a0, u, zs, frameBars(w, hh, FR, 0.05));
        const top = c.clone().addScaledVector(u, -w / 2 + FR);
        parts(MT.glass, top, u, zs + hh - FR, [[0, -(hh - 2 * FR), w - 2 * FR, hh - 2 * FR, 0.012]], -into * 0.31);
        parts(MT.frame, top, u, zs + hh - FR, [[0, -(hh - 2 * FR), w - 2 * FR, 0.035, 0.035], [0, -(hh - 2 * FR), 0.035, hh - 2 * FR, 0.035],
          [w - 2 * FR - 0.035, -(hh - 2 * FR), 0.035, hh - 2 * FR, 0.035]], -into * 0.31);
        return;
      }

        parts(MT.frame, a0, u, zs, frameBars(w, hh, FR, 0.06));

        if (m.userData.role === "roof") m.visible = sel < 0 || li < sel;
        // tầng đang xem (mái + tầng trên ẩn): đỉnh tường tô đậm như mặt cắt mặt bằng
        if (m.userData.full) { const base = m.userData.mat0 || (m.userData.mat0 = m.material); m.material = li === sel ? [base, base, MT.cut, base, base, base] : base; }
      });
    });
    furnMeshes.forEach(m => m.visible = showFurn);
    applyLabels(); fitSun(bounds()); redraw(true);
  }
  function applyLabels() { labels.forEach(l => l.visible = showLabels); redraw(); }

  // ---------- camera: khung hình vừa phần đang hiện ở mọi tỉ lệ màn hình (điện thoại dọc trước đây bị cắt) ----------
  function bounds() {                             // hộp (m) của cả nhà / tầng đang xem, gồm tam cấp phía trước
    const ex = explode ? GAP : 0;
    const lx = 0, lz = showLabels ? 1.75 : 1.0;   // chữ "MẶT TIỀN" phía trước nằm trong khung (nhãn cao độ: chừa lề trái theo điểm ảnh, camFor)
    if (sel >= 0) { const f = S.floors[sel], z0 = f.z * M + sel * ex; return new THREE.Box3(V3(lx, z0 - 0.1, -D), V3(W, z0 + f.h * M, Math.max(0.6, lz))); }
    return new THREE.Box3(V3(lx, -0.15, -D), V3(W, totalH + (S.floors.length - 1) * ex, lz));
  }
  const VIEWDIR = { top: V3(0, 1, 0.0005), front: V3(0, 0.16, 1), side: V3(1, 0.16, 0), persp: V3(0.62, 0.62, 0.8) };
  function camFor(v, b) {                         // khoảng cách nhỏ nhất để cả 8 góc hộp lọt khung (theo cả chiều ngang lẫn dọc)
    // màn hình dọc: phối cảnh chếch ít hơn (mặt bên dài 12–20 m chiếm ít bề ngang) → nhà to hơn trong khung
    const dir0 = v === "persp" || !VIEWDIR[v] ? (camera.aspect < 0.8 ? V3(0.44, 0.5, 0.9) : VIEWDIR.persp) : VIEWDIR[v];
    const back = dir0.clone().normalize(), t = b.getCenter(V3());
    if (sel >= 0) t.y = Math.min(t.y, b.min.y + 1.2);
    let right = V3(0, 1, 0).cross(back); if (right.lengthSq() < 1e-6) right = V3(1, 0, 0); right.normalize();
    const up = back.clone().cross(right).normalize();
    const tv = Math.tan(camera.fov * Math.PI / 360);
    const sw = Math.max(200, stage.clientWidth), lab = showLabels && labels.length ? Math.min(0.4, (LAB_W + 12) / sw) : 0;   // phần bề ngang dành cho nhãn cao độ (bên trái)
    const th = tv * Math.max(0.2, camera.aspect) * (1 - lab);
    let dist = 0;
    for (let i = 0; i < 8; i++) {
      const p = V3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).sub(t);
      const dz = p.dot(back);
      dist = Math.max(dist, dz + Math.abs(p.dot(right)) / th, dz + Math.abs(p.dot(up)) / tv);
    }
    dist *= 1.06;
    if (lab) t.addScaledVector(right, -lab * th / (1 - lab) * dist);   // dời khung sang trái nửa phần nhãn → nhà lệch phải, nhãn nằm trọn bên trái
    return { p: t.clone().addScaledVector(back, dist), t };
  }
  let tween = null;
  function go(v, instant) {
    view = v; userMoved = false; const r = camFor(v, bounds());
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    controls.maxDistance = Math.max(60, r.p.distanceTo(r.t) * 3);
    if (instant || reduce) { camera.position.copy(r.p); controls.target.copy(r.t); controls.update(); redraw(); return; }
    tween = { t0: performance.now(), p0: camera.position.clone(), q0: controls.target.clone(), p1: r.p, q1: r.t };
    redraw();
  }
  controls.addEventListener("start", () => { userMoved = true; tween = null; });

  // ---------- điều khiển ----------
  const fl = document.getElementById("floors");
  const chips = [];
  const addChip = (txt, small, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(i === sel));
    b.innerHTML = txt + (small ? "<small>" + small + "</small>" : "");
    b.addEventListener("click", () => { sel = i; chips.forEach(c => c.setAttribute("aria-pressed", String(c === b))); applyVis(); go(view); });
    fl.appendChild(b); chips.push(b);
  };
  addChip("Cả nhà", lvl(Math.round(totalH * 1000)), -1);
  S.floors.forEach((f, i) => addChip(f.tum ? "Tum" : "T" + f.lv, lvl(f.z), i));
  const tog = (id, fn) => { const b = document.getElementById(id); b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); fn(on); }); };
  tog("tFurn", on => { showFurn = on; applyVis(); });
  tog("tExplode", on => { explode = on; applyVis(); go(view); });
  tog("tLabels", on => { showLabels = on; applyLabels(); if (!userMoved) go(view); });
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));

  // chạm chọn phòng / đồ (chạm ngắn, không kéo)
  const sheet = document.getElementById("sheet"), hint = document.getElementById("hint");
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; hint.classList.add("off"); });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 450) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const vis = pickables.filter(m => { let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true; });
    const hit = ray.intersectObjects(vis, false)[0];
    if (!hit) { sheet.hidden = true; return; }
    const i = hit.object.userData.info; document.getElementById("sk").textContent = i.k; document.getElementById("sn").textContent = i.n; document.getElementById("sv").textContent = i.v;
    sheet.hidden = false;
  });
  document.getElementById("sclose").addEventListener("click", () => { sheet.hidden = true; });

  // ---------- vòng vẽ (chỉ khi có đổi) ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
    rtN.setSize(pw, ph); edgeMat.uniforms.px.value.set(1 / pw, 1 / ph); labelScale();
    if (!userMoved && !tween) go(view, true); else redraw();     // xoay ngang / dọc máy: vừa khung lại nếu người dùng chưa xoay / phóng
  }
  function render() {
    // gần / xa ôm sát cảnh → độ sâu đủ mịn cho nét viền
    const dist = camera.position.distanceTo(controls.target), rad = bounds().getSize(V3()).length() / 2 + 2;
    camera.near = Math.max(0.05, (dist - rad) * 0.5); camera.far = dist + rad * 3 + 50; camera.updateProjectionMatrix();
    if (showEdges) {
      const hid = [ground].concat(labels).filter(o => o.visible); hid.forEach(o => o.visible = false);
      scene.overrideMaterial = normMat; renderer.setRenderTarget(rtN); renderer.setClearColor(0x8080ff, 1); renderer.clear();
      renderer.render(scene, camera);
      scene.overrideMaterial = null; renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 0); hid.forEach(o => o.visible = true);
      edgeMat.uniforms.cn.value = camera.near; edgeMat.uniforms.cf.value = camera.far;
    }
    renderer.render(scene, camera);
    if (showEdges) { renderer.autoClear = false; renderer.render(edgeScene, edgeCam); renderer.autoClear = true; }
  }
  function frame(now) {
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / 650), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
      if (k >= 1) tween = null;
      need = Math.max(need, 1);
    }
    controls.update();                            // giảm chấn: còn trôi thì sự kiện "change" xin vẽ tiếp
    if (need > 0) { need--; render(); }
    requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(stage); resize();
  // mở thẳng theo #: "#t2", "#tum", "#t2-top", "#explode" … (chia sẻ link một tầng / một góc nhìn)
  let v0 = "persp";
  location.hash.slice(1).toLowerCase().split("-").forEach(tok => {
    const m = /^t(\d+)$/.exec(tok), i = m ? S.floors.findIndex(f => !f.tum && f.lv === +m[1]) : tok === "tum" ? S.floors.findIndex(f => f.tum) : -2;
    if (i >= 0) sel = i;
    if (tok === "top" || tok === "front" || tok === "side") v0 = tok;
    if (tok === "explode") { explode = true; document.getElementById("tExplode").setAttribute("aria-pressed", "true"); }
  });
  chips.forEach((c, k) => c.setAttribute("aria-pressed", String(k - 1 === sel)));
  applyVis(); go(v0, true); requestAnimationFrame(frame);
  window.__mbtd3d = { scene, camera, renderer, controls, groups, go, applyVis, ground, render: () => redraw(true), edges: on => { showEdges = edgeOK && on; redraw(); } };   // móc thử (tools\ui)
  loadModels();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(buildLabels);
})();
</script>
