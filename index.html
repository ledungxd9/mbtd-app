    <script>
        // bản mới (người dùng 2026-10-05 "app chưa cập nhật"): service worker mới tự chạy (skipWaiting + claim) → trang đang mở vẫn là bản cũ.
        // Mới mở app (< 60 s) → tự tải lại; đang làm → thanh "Đã có bản mới · Tải lại" (nhà đã tự lưu sau mỗi thao tác).
        (function () {
            if (!('serviceWorker' in navigator)) return;
            var had = !!navigator.serviceWorker.controller, t0 = Date.now(), done = false;
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(function (r) { r.update().catch(function () { }); }).catch(function () { });
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!had || done) return; done = true;
                if (Date.now() - t0 < 60000) { location.reload(); return; }
                var b = document.createElement('div'); b.className = 'upd';
                b.innerHTML = '<span>Đã có bản mới của app.</span><button type="button">Tải lại</button>';
                b.querySelector('button').onclick = function () { location.href = document.baseURI; };
                document.body.appendChild(b);
            });
        })();
    </script>
